# Publishes to npm when a `v*` tag is pushed, using npm trusted publishing (OIDC): no token, and
# provenance is attached automatically. The file name must match the Trusted Publisher configured on
# the package's npmjs.com settings page (workflow filename `release.yml`). Configure that after the
# first, manual, publish of 0.1.0.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # npm, not pnpm, so npm's OIDC flow and provenance are used.
      - run: npm publish --access public
